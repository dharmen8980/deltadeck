[project]
name = "deltadeck"
version = "0.2.3"
description = "Review what your AI changed, and hand it back. A local viewer for docs and code that highlights what changed."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dharmendra Sharma" }]
keywords = ["markdown", "viewer", "docs", "diff", "code-review", "ai", "local", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "watchfiles>=0.24",
    "openpyxl>=3.1",
    "playwright>=1.64.0",
    "python-multipart>=0.0.32",
    "mammoth>=1.8",
]

[project.urls]
Homepage = "https://github.com/dharmen8980/deltadeck"
Repository = "https://github.com/dharmen8980/deltadeck"
Issues = "https://github.com/dharmen8980/deltadeck/issues"
Documentation = "https://github.com/dharmen8980/deltadeck/tree/main/docs"

[project.scripts]
deltadeck = "deltadeck.cli:main"

[dependency-groups]
# Desktop build only (desktop/scripts/build-server.sh, uv run --group build --locked): exact pins,
# hashes in uv.lock. Not installed by a plain `uv sync`.
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/deltadeck"]

# The built web UI ships inside the wheel as deltadeck/ui (hatch_build.py; found by
# deltadeck.config.find_ui_dir). Run `npm run build` in web/ first. Editable installs (uv sync)
# use web/out in place.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the server and the built UI, so a wheel can be built from it without Node.
[tool.hatch.build.targets.sdist]
include = ["/server/deltadeck", "/hatch_build.py", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"web/out" = "web/out"

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
