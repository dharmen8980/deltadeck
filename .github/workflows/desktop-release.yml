# Desktop app: test, build (macOS arm64 + x64 dmg, Linux AppImage + deb), smoke-test the packaged
# app, and on a v* tag attach everything to a GitHub Release. Unsigned (no Developer ID): see
# README "Desktop app". workflow_dispatch builds without releasing.
# Actions are pinned to commit SHAs (Dependabot keeps them current: .github/dependabot.yml).
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, target: mac } # macos-14 image is retired
          - { name: macos-x64, os: macos-15-intel, target: mac } # macos-13 (last Intel image) is retired
          - { name: linux-x64, os: ubuntu-22.04, target: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ELECTRON_BUILDER_PUBLISH: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency caches: a cache poisoned by another run must not reach the shipped binaries.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Python tests
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Desktop install + unit tests
        working-directory: desktop
        run: |
          npm ci
          npm test

      - name: Web unit tests (diff engine, change rules)
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build (web, frozen server, Electron package)
        working-directory: desktop
        run: npm run dist:${{ matrix.target }}

      - name: Smoke test the packaged app (macOS)
        if: matrix.target == 'mac'
        working-directory: desktop
        run: node e2e/smoke.mjs --packaged

      - name: Smoke test the packaged app (Linux, Xvfb)
        if: matrix.target == 'linux'
        working-directory: desktop
        run: xvfb-run -a node e2e/smoke.mjs --packaged

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts && (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
